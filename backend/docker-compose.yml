services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: task_management
      MYSQL_ROOT_PASSWORD: vanshika
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/task_management?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: vanshika
      JWT_SECRET: replace-this-with-a-long-random-production-secret-value
      REDIS_HOST: redis
    ports: ["8081:8080"]
