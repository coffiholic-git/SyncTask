spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:vanshika}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.dialect: org.hibernate.dialect.MySQLDialect
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    name: ${BOOTSTRAP_ADMIN_NAME:Platform Admin}
  rate-limit:
    login-attempts: ${LOGIN_RATE_LIMIT:5}
    login-window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:60}
  password-reset:
    expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:15}
